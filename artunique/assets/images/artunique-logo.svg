<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D5005B"/>
      <stop offset="50%" stop-color="#FF2A7A"/>
      <stop offset="100%" stop-color="#A80046"/>
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#00A8B5"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FF9800"/>
    </linearGradient>
  </defs>
  
  <!-- Logo Icon: Stylized Artistic Origami Infinity Gift Knot with magenta, cyan & gold -->
  <g transform="translate(15, 12)">
    <!-- Cyan ribbon loop -->
    <path d="M12 28 C12 16, 26 8, 36 18 C44 26, 40 42, 28 46 C16 48, 12 38, 12 28 Z" fill="url(#cyanAccent)" opacity="0.95"/>
    <!-- Magenta ribbon main loop -->
    <path d="M26 12 C38 12, 54 24, 46 40 C38 54, 18 48, 22 32 C24 24, 30 18, 42 16 Z" fill="url(#logoGrad)"/>
    <!-- Gold sparkling diamond star -->
    <path d="M42 22 L45 28 L51 31 L45 34 L42 40 L39 34 L33 31 L39 28 Z" fill="url(#goldAccent)"/>
    <circle cx="20" cy="20" r="3" fill="#FFFFFF"/>
    <circle cx="34" cy="38" r="2.5" fill="#FFFFFF"/>
  </g>
  
  <!-- Brand Typography -->
  <g transform="translate(75, 42)">
    <text font-family="'Playfair Display', Georgia, serif" font-size="30" font-weight="900" fill="#1F2937">
      Art<tspan fill="#D5005B">Unique</tspan>
    </text>
  </g>
  <g transform="translate(77, 58)">
    <text font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#7A0035" letter-spacing="2.8">
      MAKE EVERY GIFT UNIQUE
    </text>
  </g>
</svg>